<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026考研全科冲刺：无限题库版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- MathJax for rendering complex generated math -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap');

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
            color: #1f2937;
            transition: background-color 0.5s;
        }

        h1,
        h2,
        h3,
        .serif {
            font-family: 'Noto Serif SC', serif;
        }

        .eng-font {
            font-family: 'Merriweather', serif;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Math & Answer Styles */
        .math-expr {
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 1.15rem;
            letter-spacing: 0.3px;
        }

        .ans-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .eng-highlight {
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 0 4px;
            border-radius: 2px;
        }

        .pol-highlight {
            background-color: #ffe4e6;
            color: #9f1239;
            padding: 0 4px;
            border-radius: 2px;
        }

        .theme-transition {
            transition: all 0.5s ease;
        }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Emergency Header -->
    <nav id="navbar" class="text-white shadow-lg sticky top-0 z-50 theme-transition bg-slate-900">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold serif">YangYuxin's Infinite</span>
                <span id="countdown-badge"
                    class="text-xs bg-yellow-400 text-slate-900 px-2 py-1 rounded font-bold animate-pulse">最后 7 天</span>
            </div>
            <div class="flex bg-white/10 rounded-lg p-1 space-x-1">
                <button onclick="switchSubject('math')" id="nav-math"
                    class="px-3 py-1 text-xs font-bold rounded transition bg-white text-slate-900">数学</button>
                <button onclick="switchSubject('eng')" id="nav-eng"
                    class="px-3 py-1 text-xs font-bold rounded transition hover:bg-white/20 text-white">英语</button>
                <button onclick="switchSubject('pol')" id="nav-pol"
                    class="px-3 py-1 text-xs font-bold rounded transition hover:bg-white/20 text-white">政治</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header id="hero-section"
        class="relative text-white py-12 theme-transition bg-gradient-to-b from-slate-900 to-slate-800">
        <div class="container mx-auto px-4 text-center">
            <h1 id="hero-title" class="text-3xl md:text-5xl font-bold mb-4 serif text-yellow-400">无限题库 · 极速生成</h1>
            <p id="hero-subtitle" class="text-slate-200 text-base md:text-lg max-w-2xl mx-auto mb-8">
                杨宇欣同学，全学科 AI 预测引擎已就绪。<br>点击 <span class="font-bold border-b-2 border-yellow-400">🔮 AI 生成</span>，获取属于你的
                2026 押题。
            </p>

            <!-- AI Consult -->
            <div
                class="max-w-3xl mx-auto bg-white/10 backdrop-blur-md p-6 rounded-xl border border-white/20 shadow-2xl">
                <div class="text-left mb-3 text-sm font-bold flex items-center text-yellow-200">
                    <span class="mr-2 text-xl">🆘</span>
                    <span id="ai-title">Gemini 备考急救室</span>
                </div>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="user-status" placeholder="输入你的困惑..."
                        class="flex-grow px-5 py-3 bg-white text-slate-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 text-sm shadow-inner">
                    <button onclick="generateEmergencyPlan()" id="btn-emergency"
                        class="bg-yellow-500 hover:bg-yellow-600 text-slate-900 px-8 py-3 rounded-lg font-bold transition whitespace-nowrap shadow-lg flex items-center justify-center">
                        <span>获取建议</span>
                    </button>
                </div>
                <div id="emergency-output"
                    class="hidden mt-4 text-left bg-white text-slate-800 p-5 rounded-lg text-sm prose max-w-none shadow-xl border-l-4 border-yellow-500">
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 space-y-16 flex-grow">

        <!-- Infinite Prediction Section -->
        <section id="simulation" class="scroll-mt-24">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
                <div>
                    <h2 id="section-title"
                        class="text-3xl font-bold text-slate-800 border-l-8 border-slate-600 pl-4 theme-transition">每日一练
                        · AI 驱动</h2>
                    <p id="section-desc" class="text-slate-500 mt-2">双模式：经典必考题(本地) / 2026预测题(AI生成)</p>
                </div>
                <!-- Dynamic Category Buttons -->
                <div id="category-tabs"
                    class="flex bg-white p-1 rounded-xl shadow-md border border-slate-200 overflow-x-auto max-w-full">
                    <!-- Injected via JS -->
                </div>
            </div>

            <div
                class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col md:flex-row min-h-[600px]">
                <!-- Problem Display -->
                <div class="w-full md:w-1/2 p-8 bg-slate-50 border-r border-slate-100 flex flex-col relative">

                    <!-- Control Buttons -->
                    <div class="absolute top-6 right-6 z-10 flex flex-col items-end gap-2">
                        <button onclick="loadNextProblem()"
                            class="flex items-center space-x-2 bg-white border border-slate-200 hover:border-slate-400 hover:bg-slate-50 text-slate-600 px-4 py-2 rounded-full text-xs font-bold shadow-sm transition group">
                            <span class="text-lg group-hover:rotate-180 transition duration-500">🔄</span>
                            <span>换一题 (经典)</span>
                        </button>
                        <!-- AI Generate Button (Universal) -->
                        <button id="btn-ai-gen" onclick="generateAIProblem()"
                            class="flex items-center space-x-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 py-2 rounded-full text-xs font-bold shadow-md hover:shadow-lg transition transform hover:scale-105">
                            <span>🔮 AI 生成 2026 预测</span>
                        </button>
                    </div>

                    <div id="problem-container" class="flex-grow flex flex-col justify-center animate-fade-in"></div>
                </div>

                <!-- Solution Area -->
                <div class="w-full md:w-1/2 p-8 flex flex-col bg-white">
                    <div id="ai-box"
                        class="flex-grow hidden bg-indigo-50 p-5 rounded-xl text-sm mb-4 border border-indigo-100 overflow-y-auto custom-scroll max-h-[400px] prose prose-sm prose-indigo shadow-inner">
                    </div>
                    <div id="static-answer"
                        class="flex-grow hidden bg-white p-6 rounded-xl text-sm text-slate-800 mb-4 overflow-y-auto custom-scroll max-h-[400px] shadow-sm border border-slate-200 leading-relaxed">
                    </div>
                    <div id="placeholder"
                        class="flex-grow flex flex-col items-center justify-center text-slate-400 text-center text-sm border-2 border-dashed border-slate-100 rounded-xl mb-4 bg-slate-50/50">
                        <span class="text-5xl mb-4 opacity-50">✍️</span>
                        <p class="font-medium text-slate-500">思考是得分的关键。<br>请先构思 / 默背再看解析。</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-auto">
                        <button onclick="showStaticAnswer()"
                            class="py-3.5 bg-slate-100 text-slate-700 rounded-xl font-bold text-sm hover:bg-slate-200 transition">查看标准解析</button>
                        <button onclick="askAiConfidence()" id="btn-ai-help"
                            class="py-3.5 bg-gradient-to-r from-slate-700 to-slate-900 text-white rounded-xl font-bold text-sm hover:shadow-lg transition flex justify-center items-center theme-btn"><span>✨
                                AI 深度点拨</span></button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Mindset Section -->
        <section id="mindset" class="scroll-mt-24 mb-12">
            <h2 id="mindset-title"
                class="text-3xl font-bold text-slate-800 border-l-8 border-yellow-500 pl-4 mb-6 theme-transition">信心加油站
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Confidence Card -->
                <div id="card-confidence"
                    class="bg-gradient-to-br from-yellow-500 to-orange-500 rounded-2xl shadow-lg p-8 text-white relative overflow-hidden flex flex-col theme-transition">
                    <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-white opacity-10 rounded-full"></div>
                    <button onclick="loadNextConfidence()"
                        class="absolute top-6 right-6 bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded-full text-xs font-bold transition flex items-center backdrop-blur-sm z-10">
                        <span class="mr-1">🔄</span> 换一句
                    </button>
                    <h3 class="text-2xl font-bold mb-4 flex items-center">
                        <span class="mr-2">💪</span> 杨宇欣，你能行！
                    </h3>
                    <div id="confidence-text"
                        class="text-white/90 font-medium text-lg leading-relaxed mb-6 flex-grow animate-fade-in min-h-[120px]">
                    </div>
                </div>
                <!-- Strategy Card -->
                <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-8 flex flex-col relative">
                    <button onclick="loadNextStrategy()"
                        class="absolute top-6 right-6 bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1 rounded-full text-xs font-bold transition flex items-center">
                        <span class="mr-1">🔄</span> 换锦囊
                    </button>
                    <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
                        <span class="mr-2 text-red-500">❤️</span> 考前心里话
                    </h3>
                    <div id="strategy-list" class="space-y-4 animate-fade-in"></div>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-slate-900 text-slate-500 py-8 text-center text-sm">
        <p class="mb-2 text-slate-400">祝 杨宇欣同学 <span class="text-yellow-500 font-bold">金榜题名 · 一战成硕</span></p>
        <p class="opacity-60 text-xs">2026 Postgraduate Entrance Exam Infinite System</p>
    </footer>

    <script>
        // --- 1. CONFIGURATION ---
        const apiKey = "AIzaSyAe0BZJvAsCSYcIyxENDiU-N-6yN6vLIiM"; // 请在此处填入您的 API Key

        // --- 2. STATIC PROBLEM BANK (FAST LOAD) ---
        const subjects = {
            'math': {
                name: "数学",
                color: "slate",
                aiRole: "考研数学出题组长",
                categories: [{ id: 'calc', name: '高数' }, { id: 'alg', name: '线代' }, { id: 'prob', name: '概率' }],
                placeholder: "数学困惑 (e.g. 级数收敛判定)...",
                problemBank: {
                    'calc': [{ title: "分部积分循环", content: "计算不定积分 I = ∫ e^{2x} · cos(3x) dx", answer: "核心：两次分部后移项。结果 I = (1/13)e^{2x}(2cos3x+3sin3x)+C" }],
                    'alg': [{ title: "伴随矩阵秩", content: "3阶矩阵 r(A)=1，求 r(A*)", answer: "公式：更低伴随零。r(A*)=0" }],
                    'prob': [{ title: "最大值分布", content: "Z=max(X,Y)，独立同分布，求F(z)", answer: "结果 [F(z)]^2" }]
                }
            },
            'eng': {
                name: "英语",
                color: "indigo",
                aiRole: "考研英语审题专家",
                categories: [{ id: 'vocab', name: '核心·词汇' }, { id: 'read', name: '阅读·逻辑' }, { id: 'write', name: '写作·话题' }],
                placeholder: "英语困惑 (e.g. 作文没思路)...",
                problemBank: {
                    'vocab': [{ title: "Vocab Check", content: "Plausible", answer: "adj. 貌似可信的" }],
                    'read': [{ title: "态度题陷阱", content: "Indifferent 是正确选项吗？", answer: "几乎必错。作者不会漠不关心。" }],
                    'write': [{ title: "科技类开头", content: "背诵科技双刃剑开头", answer: "The past few years have witnessed..." }]
                }
            },
            'pol': {
                name: "政治",
                color: "rose",
                aiRole: "考研政治阅卷组长",
                categories: [{ id: 'marx', name: '马原·分析' }, { id: 'mao', name: '毛中特·热词' }, { id: 'curr', name: '时政·押题' }],
                placeholder: "政治困惑 (e.g. 唯物史观)...",
                problemBank: {
                    'marx': [{ title: "新质生产力", content: "用唯物史观分析新质生产力", answer: "生产力决定生产关系。科技革命推动高质量发展。" }],
                    'mao': [{ title: "中国式现代化", content: "本质要求口诀？", answer: "党领社，高发全，文人共，人自命。" }],
                    'curr': [{ title: "改革总目标", content: "完善制度，推进治理现代化", answer: "二十届三中全会考点。" }]
                }
            }
        };

        // --- 3. STATE ---
        let currentSubject = 'math';
        let currentCategory = '';
        let currentProblemIndex = 0;
        let confIdx = 0;
        let stratIdx = 0;

        // --- 4. DATASETS ---
        const confidenceMsgs = ["“杨宇欣，你在这个冬天积蓄的力量，必将在试卷上绽放光芒！”", "“不要慌张，沉着冷静，一题一题攻克，硕果终将属于你。”", "“乾坤未定，你我皆是黑马。加油！”", "“行百里者半九十，坚持住！”"];
        const strategySets = [[{ title: "专注", text: "只关注当下的题目。" }, { title: "舍得", text: "遇难则过。" }], [{ title: "细心", text: "检查填涂卡。" }, { title: "书写", text: "字迹工整得卷面分。" }]];

        // --- 5. LOGIC ---
        function switchSubject(subj) {
            currentSubject = subj;
            const config = subjects[subj];

            // UI Updates
            ['math', 'eng', 'pol'].forEach(s => document.getElementById(`nav-${s}`).className = s === subj ? "px-3 py-1 text-xs font-bold rounded transition bg-white text-slate-900 shadow" : "px-3 py-1 text-xs font-bold rounded transition hover:bg-white/20 text-white");

            const themes = {
                math: { nav: "bg-slate-900", hero: "from-slate-900 to-slate-800", text: "text-slate-800", border: "border-slate-600", btn: "bg-yellow-500 hover:bg-yellow-600" },
                eng: { nav: "bg-indigo-900", hero: "from-indigo-900 to-purple-900", text: "text-slate-800", border: "border-indigo-600", btn: "bg-purple-500 hover:bg-purple-600" },
                pol: { nav: "bg-red-900", hero: "from-red-900 to-rose-900", text: "text-slate-800", border: "border-red-600", btn: "bg-rose-500 hover:bg-rose-600" }
            };
            const t = themes[subj];

            document.getElementById('navbar').className = `text-white shadow-lg sticky top-0 z-50 theme-transition ${t.nav}`;
            document.getElementById('hero-section').className = `relative text-white py-12 theme-transition bg-gradient-to-b ${t.hero}`;
            document.getElementById('section-title').className = `text-3xl font-bold ${t.text} border-l-8 ${t.border} pl-4 theme-transition`;
            document.getElementById('btn-emergency').className = `${t.btn} text-slate-900 px-8 py-3 rounded-lg font-bold transition shadow-lg flex items-center justify-center`;
            if (subj !== 'math') document.getElementById('btn-emergency').classList.replace('text-slate-900', 'text-white');

            document.getElementById('user-status').placeholder = config.placeholder;
            document.getElementById('ai-title').innerText = config.aiRole;

            const tabs = document.getElementById('category-tabs');
            tabs.innerHTML = config.categories.map(c => `<button onclick="changeCategory('${c.id}')" id="tab-${c.id}" class="text-sm px-4 py-2.5 rounded-lg font-bold transition whitespace-nowrap text-slate-600 hover:bg-slate-100">${c.name}</button>`).join('');

            changeCategory(config.categories[0].id);
        }

        function changeCategory(id) {
            currentCategory = id;
            subjects[currentSubject].categories.forEach(c => {
                const btn = document.getElementById(`tab-${c.id}`);
                const activeColor = currentSubject === 'math' ? 'bg-slate-800' : currentSubject === 'eng' ? 'bg-indigo-800' : 'bg-red-800';
                btn.className = c.id === id ? `text-sm px-4 py-2.5 rounded-lg font-bold whitespace-nowrap ${activeColor} text-white shadow-md` : "text-sm px-4 py-2.5 rounded-lg font-bold whitespace-nowrap text-slate-600 hover:bg-slate-100";
            });
            loadNextProblem(true);
        }

        function loadNextProblem(reset = false) {
            const list = subjects[currentSubject].problemBank[currentCategory];
            if (reset) currentProblemIndex = Math.floor(Math.random() * list.length);
            else currentProblemIndex = (currentProblemIndex + 1) % list.length;

            renderProblem(list[currentProblemIndex].title, list[currentProblemIndex].content, list[currentProblemIndex].answer, false);
        }

        function renderProblem(title, content, answer, isAI) {
            const container = document.getElementById('problem-container');
            container.classList.remove('fade-in'); void container.offsetWidth; container.classList.add('fade-in');

            let badgeClass = currentSubject === 'eng' ? "bg-purple-600" : currentSubject === 'pol' ? "bg-red-600" : "bg-amber-500";
            let badgeText = isAI ? "🔮 AI 2026 预测" : "📝 经典母题";
            let animate = isAI ? "animate-pulse" : "";

            container.innerHTML = `
                <div class="mb-6">
                    <span class="text-xs font-bold text-white ${badgeClass} px-2.5 py-1 rounded shadow-sm ${animate}">${badgeText}</span>
                    <span class="text-sm font-bold text-slate-500 uppercase tracking-widest ml-2">${title}</span>
                </div>
                <div class="text-lg leading-relaxed text-slate-800 font-medium">${content}</div>
            `;

            document.getElementById('ai-box').classList.add('hidden');
            document.getElementById('static-answer').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');

            // Store answer for button click
            const ansBox = document.getElementById('static-answer');
            let ansColor = currentSubject === 'eng' ? "text-purple-600" : currentSubject === 'pol' ? "text-red-600" : "text-amber-500";
            ansBox.innerHTML = `<h4 class="${ansColor} font-bold mb-4 text-xs uppercase tracking-wide border-b border-slate-100 pb-2">解析 / Analysis</h4>${answer}`;

            if (window.MathJax) MathJax.typesetPromise();
        }

        function showStaticAnswer() {
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('ai-box').classList.add('hidden');
            document.getElementById('static-answer').classList.remove('hidden');
        }

        // --- 6. AI CORE GENERATION ---
        async function callGemini(prompt) {
            if (!apiKey) { alert("请填入 API Key"); return null; }
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (e) { console.error(e); return null; }
        }

        // The Ultimate Generator
        async function generateAIProblem() {
            const btn = document.getElementById('btn-ai-gen');
            const container = document.getElementById('problem-container');

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner mr-2"></span> 出题中...`;
            container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-slate-400"><div class="spinner border-slate-400 border-t-slate-600 mb-4"></div><p>Gemini 正在分析 2026 命题趋势...</p></div>`;
            document.getElementById('static-answer').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');

            const subConfig = subjects[currentSubject];
            const catName = subConfig.categories.find(c => c.id === currentCategory).name;

            // Dynamic Prompt Construction
            let prompt = "";
            if (currentSubject === 'math') {
                prompt = `请作为考研数学出题专家，针对【数学一 · ${catName}】模块，生成一道**2026年极大概率会出现的预测题**（难度中等偏上）。
                要求：
                1. 题目要有具体的数学公式（使用LaTeX格式，但不要用$包裹，直接写公式）。
                2. 必须是具体计算或证明题，不是概念问答。
                3. 请严格按照以下格式返回HTML代码（不要Markdown标记）：
                DIV_START
                TITLE: {简短题名}
                CONTENT: {题目内容 HTML}
                ANSWER: {详细解析步骤 HTML，包含核心考点说明}
                DIV_END`;
            } else if (currentSubject === 'eng') {
                prompt = `请作为考研英语出题专家，针对【英语一 · ${catName}】模块，生成一道2026预测题。
                如果是词汇：随机选一个大纲高频难词。
                如果是阅读：生成一段简短的学术文章（3句左右）和一个最具迷惑性的选择题。
                如果是写作：生成一个预测话题。
                请严格按照以下格式返回HTML代码（不要Markdown标记）：
                DIV_START
                TITLE: {题名}
                CONTENT: {题目内容 HTML}
                ANSWER: {详细解析/范文 HTML}
                DIV_END`;
            } else {
                prompt = `请作为考研政治名师，结合2025-2026最新时政（如二十届三中全会、新质生产力等），针对【政治 · ${catName}】模块，生成一道预测题。
                请严格按照以下格式返回HTML代码（不要Markdown标记）：
                DIV_START
                TITLE: {题名}
                CONTENT: {题目内容 HTML}
                ANSWER: {详细解析 HTML，包含背诵口诀}
                DIV_END`;
            }

            const text = await callGemini(prompt);

            if (text) {
                try {
                    const title = text.split('TITLE:')[1].split('CONTENT:')[0].trim();
                    const content = text.split('CONTENT:')[1].split('ANSWER:')[0].trim();
                    const answer = text.split('ANSWER:')[1].split('DIV_END')[0].trim();
                    renderProblem(title, content, answer, true);
                } catch (e) {
                    container.innerHTML = `<p class="text-red-500 text-center">生成解析失败，请重试。</p>`;
                }
            } else {
                container.innerHTML = `<p class="text-red-500 text-center">网络请求失败。</p>`;
            }

            btn.disabled = false;
            btn.innerHTML = `<span>🔮 AI 生成 2026 预测</span>`;
        }

        // Emergency & Confidence (Same logic)
        async function generateEmergencyPlan() {
            const status = document.getElementById('user-status').value;
            if (!status) return;
            const output = document.getElementById('emergency-output');
            output.classList.remove('hidden'); output.innerHTML = "思考中...";
            const txt = await callGemini(`你是暖心学长。考生杨宇欣考前7天遇到：${status}。给3条简短建议。`);
            output.innerHTML = marked.parse(txt);
        }

        async function askAiConfidence() {
            const box = document.getElementById('ai-box');
            box.classList.remove('hidden');
            document.getElementById('static-answer').classList.add('hidden');
            box.innerHTML = "思考中...";
            // Get content text
            const pContent = document.getElementById('problem-container').innerText;
            const txt = await callGemini(`题目内容：${pContent}。作为名师，1.指出这题考点。2.给杨宇欣同学一句鼓励。`);
            box.innerHTML = marked.parse(txt);
        }

        // Mindset
        function loadNextConfidence() {
            confIdx = (confIdx + 1) % confidenceMsgs.length;
            document.getElementById('confidence-text').innerText = confidenceMsgs[confIdx];
        }
        function loadNextStrategy() {
            stratIdx = (stratIdx + 1) % strategySets.length;
            document.getElementById('strategy-list').innerHTML = strategySets[stratIdx].map((i, x) => `<li class="flex items-start"><span class="mr-2 font-bold">${x + 1}</span><p>${i.title}：${i.text}</p></li>`).join('');
        }

        // Init
        window.onload = () => {
            switchSubject('math');
            document.getElementById('confidence-text').innerText = confidenceMsgs[0];
            loadNextStrategy();
        };
    </script>
</body>

</html>
